<!DOCTYPE html>
<html lang="en" data-theme="aol" data-brightness="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dejoiy Mail</title>
<meta name="description" content="Dejoiy Mail — fast, beautiful webmail for your company." />
<link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png" />
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/themes.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
</head>
<body>
<div id="bg" aria-hidden="true"></div>

<div id="app">
  <header id="topbar">
    <button id="menu-btn" class="icon-btn only-mobile" aria-label="Open navigation">☰</button>
    <div class="brand" id="brand-home" role="button" tabindex="0" aria-label="Dejoiy Mail home">
      <span class="brand-mark"></span>
      <span class="brand-name"><img class="brand-full" src="assets/brand/dejoiy-mail-on-dark.svg" alt="Dejoiy Mail" /><img class="brand-compact" src="assets/brand/d-mail-on-dark.svg" alt="Dejoiy Mail" /></span>
    </div>
    <div class="search-wrap">
      <span class="search-ico">⌕</span>
      <input id="global-search" type="search" placeholder="Search mail…  ( press / )" autocomplete="off" aria-label="Search mail" />
      <button id="adv-search-btn" class="icon-btn" title="Advanced search">▾</button>
    </div>
    <div class="top-actions">
      <button id="check-mail-btn" class="icon-btn" title="Check for new mail">↻</button>
      <button id="theme-btn" class="icon-btn" title="Themes">🎨</button>
      <button id="shortcuts-btn" class="icon-btn" title="Keyboard shortcuts (?)">⌨</button>
      <button id="settings-btn" class="icon-btn" title="Settings">⚙</button>
      <button id="account-btn" class="avatar" title="Account">R</button>
    </div>
  </header>

  <div id="shell">
    <aside id="sidebar" aria-label="Mailbox navigation">
      <button id="compose-btn" class="compose-btn">✎&nbsp; Compose</button>
      <nav id="main-nav"></nav>
      <div class="side-foot">
        <div class="storage"><div class="storage-bar"><i id="storage-fill"></i></div><span id="storage-label"></span></div>
      </div>
    </aside>
    <div id="side-scrim"></div>
    <main id="view" tabindex="-1" aria-live="polite"></main>
  </div>

  <nav id="bottomnav" aria-label="Primary"></nav>
</div>

<div id="dialog-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/themes.js"></script>
<script src="js/filters.js"></script>
<script src="js/mail.js"></script>
<script src="js/view-today.js"></script>
<script src="js/view-mail.js"></script>
<script src="js/view-compose.js"></script>
<script src="js/view-calendar.js"></script>
<script src="js/view-contacts.js"></script>
<script src="js/view-extra.js"></script>
<script src="js/view-admin.js"></script>
<script src="js/view-settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
