<!DOCTYPE html>
<html lang="en" data-theme="pearl" data-brightness="light" data-mail-layout="list">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2f7cf6" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Dmail" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
<title>Dejoiy Mail</title>
<meta name="description" content="Dmail — fast, beautiful webmail for your company." />

<script src="js/compat.js?v=20261009m"></script>
<link rel="stylesheet" href="css/base.css?v=20261009m" />
<link rel="stylesheet" href="css/themes.css?v=20261009m" />
<link rel="stylesheet" href="css/layout.css?v=20261009m" />
<link rel="stylesheet" href="css/components.css?v=20261009m" />
<link rel="stylesheet" href="css/backend.css?v=20261009m" />
<link rel="stylesheet" href="css/mail-ui.css?v=20261009m" />
<link rel="stylesheet" href="css/aol-layout.css?v=20261009m" />
<link rel="stylesheet" href="css/mobile.css?v=20261009m" />
<link rel="stylesheet" href="css/touch.css?v=20261009m" />
<link rel="stylesheet" href="css/settings.css?v=20261009m" />
</head>
<body>
<div id="bg" aria-hidden="true"></div>

<div id="app">
  <header id="topbar">
    <button id="menu-btn" class="icon-btn only-mobile" aria-label="Open navigation">☰</button>
    <div class="brand" id="brand-home" role="button" tabindex="0" aria-label="Dmail home">
      <span class="brand-mark">✉</span>
      <span class="brand-name">dmail<span class="brand-dot">.</span></span>
    </div>
    <div class="search-wrap">
      <input id="global-search" type="search" placeholder="Find messages, documents, photos or people" autocomplete="off" aria-label="Search mail" />
      <button id="adv-search-btn" title="Advanced search">Advanced <span aria-hidden="true">⌄</span></button>
      <button id="search-submit-btn" class="search-submit" title="Search mail" aria-label="Search mail">⌕</button>
    </div>
    <div class="top-actions">
      <button id="check-mail-btn" class="icon-btn" title="Check for new mail">↻</button>
      <button id="theme-btn" class="icon-btn" title="Themes">🎨</button>
      <button id="shortcuts-btn" class="icon-btn" title="Keyboard shortcuts (?)">⌨</button>
      <button id="settings-btn" class="settings-link" title="Settings"><span aria-hidden="true">⚙</span></button>
      <span id="account-label" class="account-label"></span>
      <button id="account-btn" class="avatar" title="Account">R</button>
    </div>
  </header>

  <div id="shell">
    <aside id="sidebar" aria-label="Mailbox navigation">
      <button id="compose-btn" class="compose-btn">Compose</button>
      <nav id="main-nav"></nav>
      <div class="side-foot">
        <div class="workspace-signature"><span class="workspace-emblem">d.</span><span>Dejoiy workspace<small>Made for your everyday.</small></span></div><div id="mail-status"></div>
        <div class="storage"><div class="storage-bar"><i id="storage-fill"></i></div><span id="storage-label"></span></div>
      </div>
    </aside>
    <div id="side-scrim"></div>
    <main id="view" tabindex="-1" aria-live="polite"></main>
    <aside id="app-rail" aria-label="Apps"></aside>
  </div>

  <nav id="bottomnav" aria-label="Primary"></nav>
  <button id="fab-compose" class="fab" type="button" aria-label="Compose"></button>
</div>

<div id="dialog-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script src="js/runtime-config.js"></script>
<script src="js/icons.js?v=20261009m"></script>
<script src="js/backend.js?v=20261009m"></script>
<script src="js/data.js?v=20261009m"></script>
<script src="js/store.js?v=20261009m"></script>
<script src="js/profile.js?v=20261009m"></script>
<script src="js/settings.js?v=20261009m"></script>
<script src="js/live-themes.js?v=20261009m"></script>
<script src="js/themes.js?v=20261009m"></script>
<script src="js/filters.js?v=20261009m"></script>
<script src="js/mail.js?v=20261009m"></script>
<script src="js/view-today.js?v=20261009m"></script>
<script src="js/view-mail.js?v=20261009m"></script>
<script src="js/view-compose.js?v=20261009m"></script>
<script src="js/view-calendar.js?v=20261009m"></script>
<script src="js/view-contacts.js?v=20261009m"></script>
<script src="js/view-extra.js?v=20261009m"></script>
<script src="js/view-admin.js?v=20261009m"></script>
<script src="js/view-settings.js?v=20261009m"></script>
<script src="js/view-account-settings.js?v=20261009m"></script>
<script src="js/app.js?v=20261009m"></script>
</body>
</html>
