<div id="dm-splash" role="status" aria-live="polite">
  <svg class="dl-mark" viewBox="-22 -42 194 184" aria-hidden="true">
    <g class="dl-rings"><path class="dl-ring dl-ring-a" pathLength="100" d="M18 -20H80A70 70 0 0 1 80 120H18A18 18 0 0 1 0 102V-2A18 18 0 0 1 18 -20Z"/><path class="dl-ring dl-ring-b" pathLength="100" d="M18 -20H80A70 70 0 0 1 80 120H18A18 18 0 0 1 0 102V-2A18 18 0 0 1 18 -20Z"/></g>
    <path class="dl-box" d="M18 -20H80A70 70 0 0 1 80 120H18A18 18 0 0 1 0 102V-2A18 18 0 0 1 18 -20Z"/>
    <g transform="translate(22 17) scale(.66)">
      <circle class="dl-dot dl-dot-1" cx="13" cy="28" r="12"/>
      <circle class="dl-dot dl-dot-2" cx="13" cy="72" r="12"/>
      <path class="dl-d" fill-rule="evenodd" d="M38 0H88A50 50 0 0 1 88 100H38Z M62 26H86A24 24 0 0 1 86 74H62Z"/>
    </g>
  </svg>
  <p class="dl-text" id="dm-splash-text">Loading Dejoiy Mail…</p>
</div>
<script>
/* Loader: plays its intro for at least ~0.9s, never blocks longer than 12s. show(text) brings it back, e.g. after sign-in. */
window.DmSplash=(function(){
  var el=document.getElementById('dm-splash'),text=document.getElementById('dm-splash-text'),t0=Date.now(),open=true,cap;
  function hide(now){ if(!open)return; open=false; clearTimeout(cap);
    setTimeout(function(){ el.classList.add('dm-out'); },now?0:Math.max(0,900-(Date.now()-t0))); }
  function show(label){ if(label)text.textContent=label; t0=Date.now(); open=true; el.classList.remove('dm-out'); clearTimeout(cap); cap=setTimeout(function(){hide(true);},12000); }
  cap=setTimeout(function(){hide(true);},12000);
  return {hide:hide,show:show};
})();
</script>
