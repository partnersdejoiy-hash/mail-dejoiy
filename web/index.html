<div id="dm-splash" role="status" aria-label="Loading Dejoiy Mail">
  <div class="dm-center">
    <div class="dm-stage" aria-hidden="true">
      <div class="dm-orbit"><i></i></div>
      <div class="dm-tile">
        <svg class="dm-layer dm-depth" viewBox="74 66 380 380"><use href="#dsBody"/></svg><svg class="dm-layer dm-depth" viewBox="74 66 380 380"><use href="#dsBody"/></svg><svg class="dm-layer dm-depth" viewBox="74 66 380 380"><use href="#dsBody"/></svg><svg class="dm-layer dm-depth" viewBox="74 66 380 380"><use href="#dsBody"/></svg><svg class="dm-layer dm-depth" viewBox="74 66 380 380"><use href="#dsBody"/></svg><svg class="dm-layer dm-depth" viewBox="74 66 380 380"><use href="#dsBody"/></svg>
        <svg class="dm-layer dm-face" viewBox="74 66 380 380" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="dsG" x1="84" y1="104" x2="444" y2="408" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1F6BFF"/><stop offset=".5" stop-color="#7A3CF4"/><stop offset="1" stop-color="#FF2E92"/></linearGradient>
            <linearGradient id="dsShine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".5"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
            <path id="dsBody" d="M84 140C84 120 100 104 120 104H272C370 104 444 172 444 256S370 408 272 408H120C100 408 84 392 84 372Z"/>
            <clipPath id="dsClip"><use href="#dsBody"/></clipPath>
          </defs>
          <use href="#dsBody" fill="url(#dsG)"/>
          <g clip-path="url(#dsClip)">
            <path class="dm-fold" d="M84 408L230 286L256 300L282 286L444 408Z" fill="#fff" opacity=".12"/>
            <path class="dm-lid" d="M84 104H444V160L256 272L84 140Z" fill="#0B0A3A" opacity=".14"/>
            <rect class="dm-shine" x="0" y="60" width="120" height="400" fill="url(#dsShine)" transform="skewX(-18)"/>
          </g>
          <path class="dm-flap" pathLength="100" d="M92 142L256 270L430 166" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="dm-floor"></div>
    </div>
    <div class="dm-brandline"><div class="dm-word">d<b>mail</b></div><div class="dm-tag">BY DEJOIY · YOU+JOY</div></div>
    <div class="dm-bar" aria-hidden="true"><i></i></div>
  </div>
</div>
<script>
/* Launch screen: stays at least ~1.6s so the intro plays, never longer than 12s. */
window.DmSplash=(function(){
  var el=document.getElementById('dm-splash'),t0=Date.now(),done=false,MIN=1600;
  function hide(now){ if(done||!el)return; done=true;
    var wait=now?0:Math.max(0,MIN-(Date.now()-t0));
    setTimeout(function(){ el.classList.add('dm-out'); setTimeout(function(){ if(el.parentNode)el.parentNode.removeChild(el); },650); },wait); }
  setTimeout(function(){hide(true);},12000);
  return {hide:hide};
})();
</script>
