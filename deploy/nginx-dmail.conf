limit_req_zone $binary_remote_addr zone=dmail_login:10m rate=5r/m;
server {
 listen 80;
 listen [::]:80;
 server_name mail.dejoiy.com;
 location /.well-known/acme-challenge/ { root /var/www/acme; }
 location / { return 301 https://$host$request_uri; }
}
server {
 listen 443 ssl;
 listen [::]:443 ssl;
 server_name mail.dejoiy.com;
 ssl_certificate /etc/letsencrypt/live/mail.dejoiy.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/mail.dejoiy.com/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 add_header Strict-Transport-Security "max-age=31536000" always;
 client_max_body_size 1m;
 proxy_read_timeout 120s;
 location = /api/login {
  limit_req zone=dmail_login burst=5 nodelay;
  limit_req_status 429;
  proxy_pass http://127.0.0.1:8080;
  proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr;
 }
 location / { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
}
