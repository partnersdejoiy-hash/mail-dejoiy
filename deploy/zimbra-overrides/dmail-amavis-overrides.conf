# Dmail amavis overrides. Managed by deploy/zimbra-overrides/apply.sh.
# Loaded from amavisd.conf.in via one include line marked DMAIL-OVERRIDE.
# Zimbra never writes this file, so it survives zmconfigd and upgrades;
# apply.sh re-adds the include line after an upgrade replaces the template.
#
# Rule: mail a sender sent and that was not delivered must never vanish
# silently. Outbound (our users) -> clear bounce to the sender.
# Inbound (outside senders) -> never bounce (backscatter); quarantine or Junk.
# (No "use strict": amavis config files set package globals directly.)

# ---- Outbound, stage 1: virus + banned scan (port 10026) ----
$policy_bank{'ORIGINATING'}{final_virus_destiny}  = D_BOUNCE;
$policy_bank{'ORIGINATING'}{final_banned_destiny} = D_BOUNCE;
# amavis assumes every virus fakes its sender and suppresses the bounce.
# Our own authenticated users do not fake the sender, so always tell them.
$policy_bank{'ORIGINATING'}{viruses_that_fake_sender_maps} = [0];

# ---- Outbound, stage 2: spam scan after DKIM signing (port 10032) ----
$policy_bank{'ORIGINATING_POST'}{final_spam_destiny}   = D_BOUNCE;
$policy_bank{'ORIGINATING_POST'}{final_banned_destiny} = D_BOUNCE;
$policy_bank{'ORIGINATING_POST'}{spam_dsn_cutoff_level_maps}              = [9999];
$policy_bank{'ORIGINATING_POST'}{spam_crediblefrom_dsn_cutoff_level_maps} = [9999];

# ---- Inbound (default bank, port 10024): no backscatter ----
# Virus: unchanged (D_DISCARD + quarantine + recipient/admin warning).
$final_banned_destiny = D_DISCARD;
$banned_quarantine_to = 'virus-quarantine@corp.dejoiy.com';
# Spam at any score is delivered and filed into Junk by Zimbra, so the
# mailbox owner can always see it (Junk is purged by the spam lifetime).
$final_spam_destiny = D_PASS;

# ---- Plain-language bounce text (virus, banned and spam) ----
$notify_virus_sender_templ = read_text('/opt/zimbra/conf/dmail-templates/sender-blocked.txt');
$notify_spam_sender_templ  = read_text('/opt/zimbra/conf/dmail-templates/sender-blocked.txt');

1;
