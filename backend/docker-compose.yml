services:
  postgres:
    image: postgres:16-alpine
    container_name: dejoiy-mail-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dejoiy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dejoiy}
      POSTGRES_DB: ${POSTGRES_DB:-dejoiy_mail}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dejoiy}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dejoiy-mail-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
