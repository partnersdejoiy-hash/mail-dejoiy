<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Brico;src:url(bricolage-grotesque-latin-wght-normal.woff2) format('woff2');font-weight:200 800}
html,body{margin:0;background:#fff}
.stage{position:relative;overflow:hidden;font-family:Brico;margin-bottom:20px}
.persp{position:absolute;inset:0;perspective:1400px;display:flex;align-items:center;justify-content:center}
.phone{width:210px;height:440px;border-radius:40px;background:#121212;padding:9px;box-sizing:border-box;position:relative;transform-style:preserve-3d;box-shadow:0 40px 60px -20px rgba(80,0,40,.55),0 12px 24px rgba(80,0,40,.25)}
.phone .scr{position:relative;width:100%;height:100%;border-radius:32px;overflow:hidden;background:#fff}
.phone .scr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.phone .isl{position:absolute;top:16px;left:50%;width:66px;height:18px;margin-left:-33px;border-radius:10px;background:#121212;z-index:2}
.laptop{position:relative;transform-style:preserve-3d}
.lid{width:500px;height:322px;background:#121212;border-radius:18px 18px 4px 4px;padding:12px 12px 16px;box-sizing:border-box}
.lid img{width:100%;height:100%;object-fit:cover;object-position:top left;border-radius:6px;display:block}
.base{width:560px;height:14px;margin-left:-30px;background:linear-gradient(#d8d2cc,#a9a29b);border-radius:2px 2px 14px 14px;box-shadow:0 30px 40px -12px rgba(60,0,30,.45)}
.base:after{content:"";display:block;width:90px;height:6px;margin:0 auto;background:#8f8882;border-radius:0 0 8px 8px}
.chip{position:absolute;font-weight:700;font-size:15px;padding:8px 14px;border-radius:999px;white-space:nowrap}
</style></head><body>

<!-- 1: phone, animated (themes) -->
<div class="stage" id="phone" style="width:600px;height:520px;background:#FF4FA3">
  <div class="persp"><div class="phone" id="ph"><div class="isl"></div><div class="scr">
    <img src="phone-inbox.webp"><img src="phone-read.webp"><img src="phone-dark.webp"><img src="phone-galaxy.webp">
  </div></div></div>
  <span class="chip" style="left:36px;top:60px;background:#121212;color:#FFF4EA">Light</span>
  <span class="chip" style="right:40px;top:150px;background:#FFF4EA;color:#121212">Dark</span>
  <span class="chip" style="left:56px;bottom:90px;background:#FFF4EA;color:#121212">Galaxy</span>
  <span class="chip" style="right:30px;bottom:40px;background:#121212;color:#FFF4EA">Your own photo</span>
</div>

<!-- 2: laptop, static -->
<div class="stage" id="laptop" style="width:600px;height:440px;background:#FFF4EA">
  <div class="persp"><div class="laptop" style="transform:rotateX(10deg) rotateY(-14deg)"><div class="lid"><img src="desk-dark.webp"></div><div class="base"></div></div></div>
</div>

<!-- 3: admin, static -->
<div class="stage" id="admin" style="width:600px;height:440px;background:#121212">
  <div class="persp"><div class="laptop" style="transform:rotateX(8deg) rotateY(14deg)"><div class="lid" style="background:#2a2a2a"><img src="adm-users.webp"></div><div class="base"></div></div></div>
</div>

<!-- 4: help desk, static -->
<div class="stage" id="desk" style="width:600px;height:440px;background:#FF4FA3">
  <div class="persp"><div class="laptop" style="transform:rotateX(9deg) rotateY(-12deg)"><div class="lid"><img src="desk-ticket.webp" style="object-position:center top"></div><div class="base"></div></div></div>
</div>

<script>
const imgs=[...document.querySelectorAll('#ph img')], ph=document.getElementById('ph');
window.renderAt=t=>{
  const a=t*Math.PI*2;
  ph.style.transform=`rotateY(${Math.sin(a)*22}deg) rotateX(${8+Math.sin(a*2)*3}deg) translateY(${Math.sin(a*2)*-6}px)`;
  const n=imgs.length, x=t*n; // each shot holds, then cross-fades into the next
  imgs.forEach((im,i)=>{let d=((x-i)%n+n)%n; let o=d<0.8?1:d<1?1-(d-0.8)/0.2:d>n-0.2?(d-(n-0.2))/0.2:0; im.style.opacity=o});
};
Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode())]).then(()=>{renderAt(0);window.ready=true});
</script>
</body></html>
